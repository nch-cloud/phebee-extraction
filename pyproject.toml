[project]
name = "phebee-extraction"
version = "1.0.0"
description = "Lightweight local extraction pipeline for clinical phenotypes"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "NCH Cloud" }
]
keywords = ["phenotype", "extraction", "clinical", "hpo", "nlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "docker>=7.0.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pyarrow>=12.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.4.0",
]

[project.scripts]
phebee-extract = "phebee_extraction.cli:main"

[project.urls]
Homepage = "https://github.com/nch-cloud/phebee-extraction"
Repository = "https://github.com/nch-cloud/phebee-extraction"
Issues = "https://github.com/nch-cloud/phebee-extraction/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phebee_extraction"]
# extract.py is kept in the repo for `python extract.py` from a checkout, but is not shipped
# in the wheel; installed users get the `phebee-extract` console script instead.

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]  # Allow multiple with statements in tests
